<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Subtle top line accent -->
  <rect x="0" y="0" width="1200" height="3" fill="#333"/>

  <!-- Left vertical accent line -->
  <rect x="80" y="85" width="3" height="130" fill="#333"/>

  <!-- Name -->
  <text x="100" y="135" font-family="'Georgia', 'Times New Roman', serif" font-size="48" font-weight="400" fill="#1a1a1a" letter-spacing="-1">
    Mohamed Bayoumi
  </text>

  <!-- Role -->
  <text x="103" y="170" font-family="'SF Mono', 'Consolas', 'Monaco', monospace" font-size="16" fill="#666" letter-spacing="3">
    FLUTTER DEVELOPER
  </text>

  <!-- Minimal dots decoration -->
  <circle cx="103" cy="205" r="3" fill="#333"/>
  <circle cx="118" cy="205" r="3" fill="#999"/>
  <circle cx="133" cy="205" r="3" fill="#ccc"/>

  <!-- Subtle right side decoration — brackets -->
<text x="980" y="170" font-family="'SF Mono', 'Consolas', monospace" font-size="72" fill="#555555" font-weight="600">{ }</text>
  <!-- Bottom subtle line -->
  <rect x="80" y="270" width="200" height="1" fill="#ddd"/>
</svg>
